<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Card Demos | CPSC 100</title>
  <meta name="description" content="Watch, then try, the W5A searching and sorting algorithms with playing cards.">
  <link rel="icon" href="../assets/favicon/ubc-favicon.jpg">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #092042;
      --gold: #E0AB3A;
      --indigo: #140480;
      --iteration: #B34A22;
      --selection: #723289;
      --sequencing: #35746E;
      --ink: #1c2333;
      --muted: #545f73;
      --line: #d5dae3;
      --page: #f3f5f9;
      --heart: #c3262e;
      --club: #16181d;
      --anim: 450ms;
      color-scheme: light;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      /* Keep the width steady when a scrollbar comes and goes, so card sizes do not flip-flop. */
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Source Sans Pro", "Helvetica Neue", Arial, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.4;
      overflow-x: hidden;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 16px;
    }

    [hidden] {
      display: none !important;
    }

    /* Header ------------------------------------------------------------- */

    .top {
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .top-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px 16px;
      padding-top: 4px;
      padding-bottom: 4px;
    }

    h1 {
      margin: 0;
      color: var(--indigo);
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 20px;
    }

    .tour-btn {
      min-height: 34px;
      padding: 4px 14px;
      border: 2px solid var(--navy);
      border-radius: 999px;
      background: #fff;
      color: var(--navy);
      font-weight: 700;
      cursor: pointer;
    }

    .tour-btn:focus-visible {
      outline: 3px solid var(--indigo);
      outline-offset: 2px;
    }

    .site-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0 20px;
    }

    .site-link {
      display: inline-block;
      padding: 8px 0;
      color: #0374B5;
      font-weight: 600;
    }

    .site-link:focus-visible {
      outline: 3px solid var(--indigo);
      outline-offset: 2px;
      border-radius: 2px;
    }

    main {
      padding-top: 12px;
      padding-bottom: 32px;
    }

    /* Buttons ------------------------------------------------------------ */

    button {
      font: inherit;
      touch-action: manipulation;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 8px 16px;
      border: 2px solid var(--navy);
      border-radius: 10px;
      background: #fff;
      color: var(--navy);
      font-weight: 600;
      line-height: 1.15;
      cursor: pointer;
      transition: background-color 150ms, color 150ms, transform 120ms;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: var(--navy);
      color: #fff;
    }

    .btn:disabled,
    .btn[aria-disabled="true"] {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    @media (hover: hover) {
      .btn:hover {
        background: #e9edf5;
      }

      .btn.primary:hover {
        background: #133466;
      }

      .btn:disabled:hover,
      .btn[aria-disabled="true"]:hover {
        background: #fff;
      }

      .btn.primary:disabled:hover,
      .btn.primary[aria-disabled="true"]:hover {
        background: var(--navy);
      }

      .tab:hover,
      .tour-btn:hover {
        background: #e9edf5;
      }

      .card.is-pickable:hover {
        transform: translateY(-4px);
      }
    }

    .btn:focus-visible,
    .tab:focus-visible,
    .seg button:focus-visible {
      outline: 3px solid var(--indigo);
      outline-offset: 2px;
    }

    .icon {
      font-size: 0.85em;
      line-height: 1;
    }

    /* Algorithm tabs ---------------------------------------------------- */

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--navy);
      font-weight: 600;
      cursor: pointer;
      transition: background-color 150ms, box-shadow 150ms;
    }

    .tab-num {
      display: inline-grid;
      place-items: center;
      width: 1.5em;
      height: 1.5em;
      border-radius: 50%;
      background: #e3e8f1;
      font-size: 0.85em;
    }

    .tab[aria-pressed="true"] {
      border-color: var(--navy);
      background: var(--navy);
      color: #fff;
      box-shadow: inset 0 -4px 0 var(--gold);
    }

    .tab[aria-pressed="true"] .tab-num {
      background: var(--gold);
      color: var(--navy);
    }

    /* Mode switch and idea line ----------------------------------------- */

    .mode-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      margin-bottom: 10px;
    }

    .seg {
      display: inline-flex;
      flex: 0 0 auto;
      padding: 3px;
      border: 2px solid var(--navy);
      border-radius: 999px;
      background: #fff;
    }

    .seg button {
      min-height: 38px;
      padding: 4px 18px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--navy);
      font-weight: 700;
      cursor: pointer;
    }

    .seg button[aria-pressed="true"] {
      background: var(--navy);
      color: #fff;
    }

    .seg.small button {
      min-height: 34px;
      padding: 2px 12px;
      font-weight: 600;
    }

    .idea {
      flex: 1 1 320px;
      margin: 0;
      color: var(--muted);
    }

    .idea-label {
      color: var(--navy);
      font-weight: 700;
    }

    /* The table --------------------------------------------------------- */

    .table {
      --card-w: 96px;
      --gap: 10px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px 28px;
      padding: 8px 16px;
      border-radius: 18px;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(255, 255, 255, 0.12), transparent 60%),
        radial-gradient(ellipse at 50% 120%, rgba(0, 0, 0, 0.35), transparent 60%),
        var(--navy);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07), 0 10px 24px rgba(9, 32, 66, 0.22);
    }

    .table.target-top {
      flex-direction: column;
      gap: 0;
    }

    .target {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      padding-top: 6px;
      color: var(--gold);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .table.target-top .target {
      flex-direction: row;
      gap: 10px;
      padding-top: 10px;
    }

    .target .card-static {
      width: var(--card-w);
      height: calc(var(--card-w) * 1.4);
      position: relative;
    }

    .table.target-top .target .card-static {
      --card-w: 40px;
    }

    .target .front {
      box-shadow: 0 0 0 2px var(--gold), 0 6px 14px rgba(0, 0, 0, 0.4);
    }

    .row {
      display: flex;
      justify-content: center;
      gap: var(--gap);
      flex: 1 1 auto;
      min-width: 0;
      padding: 14px 0 22px;
    }

    .slot {
      position: relative;
      flex: 0 0 auto;
      width: var(--card-w);
    }

    /* Cards ------------------------------------------------------------- */

    .card {
      position: relative;
      display: block;
      width: var(--card-w);
      height: calc(var(--card-w) * 1.4);
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: calc(var(--card-w) * 0.09);
      background: none;
      color: inherit;
      perspective: 700px;
      cursor: default;
      transition: transform calc(var(--anim) * 0.6) ease, opacity var(--anim) ease, filter var(--anim) ease;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .card.is-pickable {
      cursor: pointer;
    }

    .card:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform calc(var(--anim) * 1.15) cubic-bezier(0.3, 0.7, 0.25, 1);
    }

    .card.is-down .card-inner {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: calc(var(--card-w) * 0.09);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
      /* The visibility swap at the half-way point backs up backface-visibility, so the
         right face still shows if a browser flattens the 3D (a scaled or zoomed frame). */
      transition: box-shadow calc(var(--anim) * 0.6) ease,
        visibility 0s linear calc(var(--anim) * 0.575);
      overflow: hidden;
    }

    .card.is-down .front,
    .card:not(.is-down) .back {
      visibility: hidden;
    }

    .front {
      background: #fff;
      border: 1px solid #c9ced8;
      font-weight: 700;
      line-height: 1;
    }

    .front.hearts {
      color: var(--heart);
    }

    .front.clubs {
      color: var(--club);
    }

    .corner {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .corner.tl {
      top: 6%;
      left: 9%;
    }

    .corner.br {
      right: 9%;
      bottom: 6%;
      transform: rotate(180deg);
    }

    .corner .r {
      font-size: calc(var(--card-w) * 0.24);
    }

    .corner .s {
      font-size: calc(var(--card-w) * 0.17);
    }

    .pip {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: calc(var(--card-w) * 0.5);
    }

    .back {
      transform: rotateY(180deg);
      border: 2px solid #f4f1e8;
      background:
        repeating-linear-gradient(45deg, rgba(224, 171, 58, 0.75) 0 1.5px, transparent 1.5px 8px),
        repeating-linear-gradient(-45deg, rgba(224, 171, 58, 0.75) 0 1.5px, transparent 1.5px 8px),
        #0b2a57;
      background-clip: padding-box;
    }

    .back::after {
      content: "";
      position: absolute;
      inset: 8%;
      border: 1.5px solid rgba(224, 171, 58, 0.9);
      border-radius: calc(var(--card-w) * 0.05);
    }

    /* Compared cards lift and get a gold outline. */
    .card.is-focus {
      transform: translateY(-10px);
    }

    .card.is-focus .face {
      box-shadow: 0 0 0 3px var(--gold), 0 12px 20px rgba(0, 0, 0, 0.5);
    }

    /* Sorted cards get a gold edge along the bottom. */
    .card.is-sorted .front::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: max(4px, calc(var(--card-w) * 0.08));
      background: var(--gold);
    }

    /* Binary search dims the ruled-out cards. */
    .card.is-out {
      opacity: 0.3;
      filter: saturate(0.3);
      transform: scale(0.92);
    }

    .tag {
      position: absolute;
      top: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%);
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--gold);
      color: var(--navy);
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      transition: opacity calc(var(--anim) * 0.6) ease;
      pointer-events: none;
    }

    .tag .short {
      display: none;
    }

    .slot.is-marked .tag {
      opacity: 1;
    }

    /* Small cards: drop the lower corner and keep the rank readable. */
    .table.is-tiny .corner.br {
      display: none;
    }

    .table.is-tiny .corner.tl {
      top: 5%;
      left: 0;
      right: 0;
    }

    .table.is-tiny .corner .r {
      font-size: max(12px, calc(var(--card-w) * 0.36));
    }

    .table.is-tiny .corner .s {
      font-size: max(9px, calc(var(--card-w) * 0.26));
    }

    .table.is-tiny .pip {
      top: 40%;
      font-size: calc(var(--card-w) * 0.4);
    }

    .table.is-tiny .tag {
      padding: 0 4px;
      font-size: 0.68rem;
    }

    .table.is-tiny .tag .long {
      display: none;
    }

    .table.is-tiny .tag .short {
      display: inline;
    }

    .table.is-tiny .card.is-focus {
      transform: translateY(-7px);
    }

    .table.is-tiny .back {
      border-width: 1.5px;
      background:
        repeating-linear-gradient(45deg, rgba(224, 171, 58, 0.75) 0 1px, transparent 1px 5px),
        repeating-linear-gradient(-45deg, rgba(224, 171, 58, 0.75) 0 1px, transparent 1px 5px),
        #0b2a57;
    }

    /* First-visit invitation to the tour ----------------------------------- */

    .intro {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 16px;
      margin-bottom: 10px;
      padding: 8px 8px 8px 16px;
      border-left: 5px solid var(--indigo);
      border-radius: 8px;
      background: #fff;
    }

    .intro p {
      margin: 0;
    }

    .intro-label {
      color: var(--indigo);
      font-weight: 700;
    }

    .intro-buttons {
      display: flex;
      gap: 8px;
    }

    /* Status: what is happening, the narration, and where the run is ------ */

    .status {
      position: relative;
      margin: 10px 0;
      padding: 8px 16px 10px;
      border-left: 5px solid var(--gold);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .status.is-feedback {
      border-left-color: var(--iteration);
      background: #fdf3ee;
    }

    .status-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 12px;
      font-size: 0.95rem;
    }

    .state-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border: 2px solid var(--navy);
      border-radius: 999px;
      color: var(--navy);
      font-weight: 700;
      white-space: nowrap;
    }

    .state-icon::before {
      content: "\25CB"; /* ready: an open circle */
    }

    .state-pill[data-state="paused"] .state-icon::before {
      content: "\275A\275A";
      font-size: 0.7em;
    }

    .state-pill[data-state="playing"] {
      background: var(--navy);
      color: #fff;
    }

    .state-pill[data-state="playing"] .state-icon::before {
      content: "\25B6";
    }

    .state-pill[data-state="turn"] {
      border-color: var(--gold);
      background: var(--gold);
      color: var(--navy);
    }

    .state-pill[data-state="turn"] .state-icon::before {
      content: "\25CF"; /* a filled dot: waiting for you */
    }

    .state-pill[data-state="moving"] {
      border-color: #5b6475;
      color: #3b4352;
    }

    .state-pill[data-state="moving"] .state-icon::before {
      content: "\2026";
    }

    .state-pill[data-state="retry"] {
      border-color: var(--iteration);
      background: var(--iteration);
      color: #fff;
    }

    .state-pill[data-state="retry"] .state-icon::before {
      content: "\21BA"; /* try again */
    }

    .state-pill[data-state="done"] {
      border-color: var(--sequencing);
      background: var(--sequencing);
      color: #fff;
    }

    .state-pill[data-state="done"] .state-icon::before {
      content: "\2713";
    }

    .phase {
      color: var(--ink);
      font-weight: 600;
    }

    .progress-text {
      color: var(--muted);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .narration {
      min-height: 2.8em;
      margin: 4px 0 2px;
      font-size: 1.15rem;
    }

    .narration .prompt {
      display: block;
      margin-top: 2px;
      color: var(--indigo);
      font-weight: 700;
    }

    .timeline {
      position: relative;
      flex: 1 1 200px;
      min-width: 140px;
      height: 26px;
    }

    /* The step timeline: a range input drawn as a track that fills up. */
    .scrub {
      --pct: 0%;
      display: block;
      width: 100%;
      height: 26px;
      margin: 0;
      background: transparent;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .scrub::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--navy) var(--pct), #dde2ea var(--pct));
    }

    .scrub::-moz-range-track {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--navy) var(--pct), #dde2ea var(--pct));
    }

    .scrub::-webkit-slider-thumb {
      width: 20px;
      height: 20px;
      margin-top: -6px;
      border: 3px solid var(--gold);
      border-radius: 50%;
      background: var(--navy);
      -webkit-appearance: none;
      appearance: none;
    }

    .scrub::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: 3px solid var(--gold);
      border-radius: 50%;
      background: var(--navy);
    }

    .scrub:focus-visible {
      outline: 3px solid var(--indigo);
      outline-offset: 2px;
      border-radius: 999px;
    }

    .progress {
      position: absolute;
      top: 9px;
      left: 0;
      right: 0;
      height: 8px;
      border-radius: 999px;
      background: #dde2ea;
      overflow: hidden;
    }

    .progress-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: 999px;
      background: var(--navy);
      transition: width 300ms ease;
    }

    /* Fills up while the next automatic step is on its way. */
    .countdown {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: rgba(224, 171, 58, 0.25);
    }

    .countdown-fill {
      display: block;
      height: 100%;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
    }

    /* Controls ---------------------------------------------------------- */

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .controls .spacer {
      flex: 1 1 0;
    }

    .speed {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    .speed-input {
      width: 150px;
      height: 28px;
      margin: 0;
      accent-color: var(--navy);
      cursor: pointer;
    }

    .speed-input:focus-visible {
      outline: 3px solid var(--indigo);
      outline-offset: 3px;
    }

    .speed-out {
      min-width: 3.2em;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--navy);
      color: #fff;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .bottom-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 16px;
    }

    .keys {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    kbd {
      display: inline-block;
      min-width: 1.6em;
      padding: 0 5px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 4px;
      background: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      text-align: center;
    }

    .decide {
      display: flex;
      flex: 1 1 360px;
      gap: 10px;
    }

    .btn.big {
      flex: 1 1 0;
      min-height: 56px;
      font-size: 1.2rem;
    }

    .finish {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      margin-bottom: 14px;
      padding: 14px 18px;
      border: 2px solid var(--gold);
      border-radius: 14px;
      background: #fff;
    }

    .finish-text {
      flex: 1 1 320px;
    }

    .finish-main {
      margin: 0;
      color: var(--navy);
      font-size: 1.35rem;
      font-weight: 700;
    }

    .finish-compare {
      margin: 2px 0 0;
      color: var(--muted);
    }

    .finish-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Pseudocode and counters ------------------------------------------- */

    .info {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 14px;
      align-items: start;
      margin-bottom: 12px;
    }

    .code-box {
      padding: 14px 16px 16px;
      border-radius: 14px;
      background: var(--navy);
      color: #fff;
    }

    .code-line {
      position: relative;
      display: flex;
      gap: 6px;
      padding: 4px 8px 4px 4px;
      border-radius: 6px;
      font-size: 1.08rem;
      transition: background-color 200ms;
    }

    .code-line+.code-line {
      margin-top: 4px;
    }

    .code-line .arrow {
      flex: 0 0 1em;
      color: var(--gold);
      visibility: hidden;
    }

    .code-line.is-active {
      background: rgba(224, 171, 58, 0.22);
    }

    .code-line.is-active .arrow {
      visibility: visible;
    }

    .code-line .kw {
      color: var(--gold);
      font-weight: 700;
    }

    .code-line.indent-1 {
      margin-left: 22px;
    }

    .code-line.indent-2 {
      margin-left: 50px;
    }

    .code-line.indent-1::before,
    .code-line.indent-2::before {
      content: "";
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: -10px;
      width: 3px;
      border-radius: 2px;
      background: #7d8698;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .pill {
      padding: 4px 14px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: help;
    }

    .pill:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }

    /* A word with a definition: hover, focus or tap it. */
    .term {
      min-height: 24px;
      padding: 3px 0 1px;
      border: 0;
      border-bottom: 1px dotted currentColor;
      background: none;
      color: inherit;
      font-weight: inherit;
      cursor: help;
    }

    .term:focus-visible {
      outline: 3px solid var(--indigo);
      outline-offset: 2px;
    }

    /* Tooltips ---------------------------------------------------------- */

    .tip {
      position: absolute; /* page coordinates: it scrolls with what it describes */
      z-index: 60;
      max-width: min(280px, calc(100vw - 32px));
      padding: 6px 10px;
      /* Indigo with a light edge, so it stands out on the navy panels and on white. */
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      background: var(--indigo);
      color: #fff;
      font-size: 0.9rem;
      line-height: 1.35;
      box-shadow: 0 0 0 1px rgba(9, 32, 66, 0.35), 0 8px 22px rgba(9, 32, 66, 0.45);
      pointer-events: none;
    }

    .tip kbd {
      min-width: 1.4em;
      border-color: rgba(255, 255, 255, 0.6);
      background: #2a1aa0;
      color: #fff;
    }

    /* Tour -------------------------------------------------------------- */

    .tour {
      position: fixed;
      inset: 0;
      z-index: 50;
    }

    /* While the tour is open the page holds still; the tour scrolls to each stop itself.
       The root takes the dimmed colour too: a classic scrollbar's gutter (Windows, Linux)
       sits outside the fixed overlay and would otherwise stay bright. */
    html.touring {
      overflow: hidden;
      background-color: rgb(98, 113, 136);
      background-color: color-mix(in srgb, var(--navy) 62%, var(--page));
    }

    .tour-spot {
      position: fixed;
      border-radius: 14px;
      box-shadow: 0 0 0 3px var(--gold), 0 0 0 200vmax rgba(9, 32, 66, 0.62);
      transition: top 300ms ease, left 300ms ease, width 300ms ease, height 300ms ease;
      pointer-events: none;
    }

    .tour-card {
      position: fixed;
      width: min(380px, calc(100vw - 32px));
      padding: 14px 16px 12px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 16px 40px rgba(9, 32, 66, 0.45);
    }

    .tour-count {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .tour-title {
      margin: 2px 0 4px;
      color: var(--indigo);
      font-size: 1.25rem;
    }

    .tour-title:focus {
      outline: none;
    }

    .tour-text {
      margin: 0 0 12px;
    }

    .tour-buttons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .tour-close {
      min-height: 44px;
      margin-left: auto;
      padding: 0 4px;
      border: 0;
      background: none;
      color: #0374B5;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }

    .tour-close:focus-visible {
      outline: 3px solid var(--indigo);
      outline-offset: 2px;
    }

    .pill.iteration {
      background: var(--iteration);
    }

    .pill.selection {
      background: var(--selection);
    }

    .pill.sequencing {
      background: var(--sequencing);
    }

    .stats {
      display: grid;
      gap: 8px;
    }

    .stat {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .stat-num {
      display: inline-block;
      color: var(--navy);
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .stat-num small {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 600;
    }

    .stat-num.bump {
      animation: bump 320ms ease;
    }

    @keyframes bump {
      40% {
        transform: scale(1.18);
        color: var(--iteration);
      }
    }

    /* Deals ------------------------------------------------------------- */

    .deals {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .deals-label {
      color: var(--muted);
      font-weight: 600;
    }

    .deals .btn[aria-pressed="true"] {
      background: #e3e8f1;
      box-shadow: inset 0 -3px 0 var(--gold);
    }

    noscript p {
      padding: 12px 16px;
      border-radius: 8px;
      background: #fff;
    }

    /* Narrow screens ---------------------------------------------------- */

    @media (max-width: 720px) {
      body {
        font-size: 1rem;
      }

      /* Title and Tour on one line, the site links under them. */
      .top-inner {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
      }

      .top-actions {
        display: contents;
      }

      .site-links {
        grid-column: 1 / -1;
      }

      h1 {
        font-size: 1.4rem;
      }

      .tab {
        padding: 6px 10px;
        min-height: 40px;
      }

      .table {
        padding: 6px;
        border-radius: 14px;
      }

      .narration {
        font-size: 1.05rem;
      }

      .speed-input {
        flex: 1 1 auto;
        width: auto;
      }

      /* On a phone the timeline gets its own line, under the status. */
      .status-head .timeline {
        order: 1;
        flex-basis: 100%;
      }

      .progress-text {
        margin-left: auto;
      }

      .info {
        grid-template-columns: minmax(0, 1fr);
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .stat {
        display: block;
        padding: 6px 10px 8px;
      }

      .stat-num {
        font-size: 1.5rem;
      }

      .code-line {
        font-size: 1rem;
      }

      .code-line.indent-1 {
        margin-left: 16px;
      }

      .code-line.indent-2 {
        margin-left: 36px;
      }

      .keys {
        display: none;
      }

      /* Reset, Back, Play, Next share one row; speed gets the next one. */
      #watch-controls .controls>.btn {
        flex: 1 1 0;
        padding: 8px 4px;
      }

      .controls .spacer {
        display: none;
      }

      .speed {
        flex: 1 1 100%;
      }

      .decide {
        flex-basis: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition-duration: 0s !important;
        transition-delay: 0s !important;
        animation-duration: 0s !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="wrap top-inner">
      <h1>Card Demos</h1>
      <div class="top-actions">
        <button type="button" class="tour-btn" id="btn-tour" data-tip="A one-minute tour of this page" data-keys="?">Tour</button>
        <nav class="site-links" aria-label="Course site">
          <a class="site-link" href="../#/schedule">Course schedule</a>
          <a class="site-link" href="../">Back to course site</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="wrap">
    <noscript>
      <p>This page needs JavaScript to deal the cards.</p>
    </noscript>

    <div class="intro" id="intro" hidden>
      <p><span class="intro-label">New here?</span> A one-minute tour shows how this page works.</p>
      <div class="intro-buttons">
        <button type="button" class="btn primary" id="btn-intro-tour">Take the tour</button>
        <button type="button" class="btn" id="btn-intro-dismiss">No thanks</button>
      </div>
    </div>

    <div class="tabs" id="tabs" role="group" aria-label="Algorithm"></div>

    <div class="mode-bar">
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" id="mode-watch" aria-pressed="true">Watch</button>
        <button type="button" id="mode-try" aria-pressed="false">Try it</button>
      </div>
      <p class="idea" id="idea"></p>
    </div>

    <section class="table" id="table" aria-label="Card table">
      <div class="target" id="target" hidden>
        <span>Find</span>
        <div class="card-static" id="target-card" role="img"></div>
      </div>
      <div class="row" id="row"></div>
    </section>

    <section class="status" id="status" aria-label="What is happening">
      <div class="status-head">
        <span class="state-pill" id="state-pill" data-state="ready"><span class="state-icon" aria-hidden="true"></span><span id="state-text">Ready</span></span>
        <span class="phase" id="phase"></span>
        <div class="timeline">
          <input type="range" class="scrub" id="scrub" min="0" max="1" step="1" value="0" aria-label="Step" data-tip="Drag to jump to any step">
          <div class="progress" id="progress" role="progressbar" aria-label="Decisions made" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" hidden><span class="progress-fill" id="progress-fill"></span></div>
        </div>
        <span class="progress-text" id="progress-text"></span>
      </div>
      <p class="narration" id="narration" aria-live="polite"></p>
      <div class="countdown" id="countdown" aria-hidden="true" hidden><span class="countdown-fill" id="countdown-fill"></span></div>
    </section>

    <div id="watch-controls">
      <div class="controls">
        <button type="button" class="btn" id="btn-reset">Reset</button>
        <button type="button" class="btn" id="btn-back"><span class="icon" aria-hidden="true">&#9664;</span> Back</button>
        <button type="button" class="btn primary" id="btn-play"><span class="icon" aria-hidden="true">&#9654;</span> <span>Play</span></button>
        <button type="button" class="btn" id="btn-next">Next <span class="icon" aria-hidden="true">&#9654;</span></button>
        <span class="spacer"></span>
        <label class="speed" data-tip="How fast steps play, from a quarter speed to three times" data-keys="&minus; +">
          <span class="speed-label">Speed</span>
          <input type="range" class="speed-input" min="0" max="6" step="1" value="3" list="speed-ticks">
          <output class="speed-out">&times;1</output>
        </label>
      </div>
    </div>

    <div class="controls" id="try-controls" hidden>
      <div class="decide" id="decide">
        <button type="button" class="btn primary big" id="btn-swap">Swap</button>
        <button type="button" class="btn big" id="btn-noswap">Don't swap</button>
      </div>
      <button type="button" class="btn" id="btn-show">Show me</button>
      <span class="spacer"></span>
      <label class="speed" data-tip="How fast steps play, from a quarter speed to three times" data-keys="&minus; +">
        <span class="speed-label">Speed</span>
        <input type="range" class="speed-input" min="0" max="6" step="1" value="3" list="speed-ticks">
        <output class="speed-out">&times;1</output>
      </label>
    </div>

    <div class="finish" id="finish" role="status" hidden>
      <div class="finish-text">
        <p class="finish-main" id="finish-main"></p>
        <p class="finish-compare" id="finish-compare"></p>
      </div>
      <div class="finish-buttons">
        <button type="button" class="btn primary" id="btn-again">Try again</button>
        <button type="button" class="btn" id="btn-watch-it">Watch it</button>
      </div>
    </div>

    <div class="info">
      <div class="code-box">
        <div id="code" aria-label="Pseudocode"></div>
        <div class="pills" id="pills"></div>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-label" id="label-a"></span><span class="stat-num" id="num-a">0</span></div>
        <div class="stat" id="stat-b"><span class="stat-label" id="label-b"></span><span class="stat-num" id="num-b">0</span></div>
        <div class="stat" id="stat-c"><span class="stat-label" id="label-c"></span><span class="stat-num" id="num-c">0</span></div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="deals" id="deals" role="group" aria-label="Deal"></div>
      <p class="keys" id="keys">Keys: <kbd>&rarr;</kbd> <kbd>&larr;</kbd> step, <kbd>Space</kbd> play, <kbd>Home</kbd> <kbd>End</kbd> first or last, <kbd>&minus;</kbd> <kbd>+</kbd> speed, <kbd>?</kbd> tour. A clicker works too.</p>
    </div>
  </main>

  <datalist id="speed-ticks">
    <option value="0"></option><option value="1"></option><option value="2"></option><option value="3"></option>
    <option value="4"></option><option value="5"></option><option value="6"></option>
  </datalist>

  <div class="tip" id="tip" role="tooltip" hidden></div>

  <div class="tour" id="tour" hidden>
    <div class="tour-spot" id="tour-spot"></div>
    <div class="tour-card" id="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-text">
      <p class="tour-count" id="tour-count"></p>
      <h2 class="tour-title" id="tour-title" tabindex="-1"></h2>
      <p class="tour-text" id="tour-text"></p>
      <div class="tour-buttons">
        <button type="button" class="btn" id="tour-back">Back</button>
        <button type="button" class="btn primary" id="tour-next">Next</button>
        <button type="button" class="tour-close" id="tour-close">End tour</button>
      </div>
    </div>
  </div>

  <script src="cards-engine.js?v=2"></script>
  <script>
    (function () {
      'use strict';

      // Must match cards-engine.js?v= in the script tag and CardEngine.VERSION.
      var ENGINE_VERSION = 2;
      var E = window.CardEngine;
      if (!E || E.VERSION !== ENGINE_VERSION) {
        document.getElementById('narration').textContent =
          'The card demos could not load. Check your connection and refresh the page.';
        return;
      }
      var ALG = E.ALGORITHMS;

      // Milliseconds per step at x1; the speed slider divides it.
      var BASE_MS = 1200;
      var SPEED_STEPS = [0.25, 0.5, 0.75, 1, 1.5, 2, 3];
      var SPEED_NAMES = ['quarter speed', 'half speed', 'three-quarter speed', 'normal speed',
        '1.5 times speed', 'double speed', 'triple speed'];
      var NORMAL_SPEED = 3;
      // ︎ asks for the text form of the suit, so phones do not draw an emoji.
      var SUIT = { hearts: '♥︎', clubs: '♣︎' };
      // After each move, ignore answers this long, so a double click or double tap cannot
      // also answer the next question.
      var SETTLE_MS = 250;
      var SORT_RANKS = [1, 2, 3, 4, 5, 6, 7, 8];
      var SEARCH_RANKS = [1, 2, 3, 4, 5, 6, 7, 8, 9];

      var $ = function (id) { return document.getElementById(id); };
      var els = {
        tabs: $('tabs'), modeWatch: $('mode-watch'), modeTry: $('mode-try'), idea: $('idea'),
        table: $('table'), target: $('target'), targetCard: $('target-card'), row: $('row'),
        narration: $('narration'), watchControls: $('watch-controls'), reset: $('btn-reset'),
        back: $('btn-back'), play: $('btn-play'), next: $('btn-next'),
        tryControls: $('try-controls'), decide: $('decide'), swap: $('btn-swap'),
        noswap: $('btn-noswap'), show: $('btn-show'), finish: $('finish'),
        finishMain: $('finish-main'), finishCompare: $('finish-compare'),
        again: $('btn-again'), watchIt: $('btn-watch-it'), code: $('code'), pills: $('pills'),
        labelA: $('label-a'), numA: $('num-a'), statB: $('stat-b'), labelB: $('label-b'),
        numB: $('num-b'), labelC: $('label-c'), numC: $('num-c'), statC: $('stat-c'), deals: $('deals'),
        keys: $('keys'), intro: $('intro'), introTour: $('btn-intro-tour'), introDismiss: $('btn-intro-dismiss'),
        tourBtn: $('btn-tour'), status: $('status'), statePill: $('state-pill'), stateText: $('state-text'),
        phase: $('phase'), progressText: $('progress-text'), scrub: $('scrub'), progress: $('progress'),
        progressFill: $('progress-fill'), countdown: $('countdown'), countdownFill: $('countdown-fill'),
        tip: $('tip'), tour: $('tour'), tourSpot: $('tour-spot'), tourCard: $('tour-card'),
        tourCount: $('tour-count'), tourTitle: $('tour-title'), tourText: $('tour-text'),
        tourBack: $('tour-back'), tourNext: $('tour-next'), tourClose: $('tour-close')
      };

      var state = {
        algo: 'linear',
        mode: 'watch',
        speed: NORMAL_SPEED, // index into SPEED_STEPS
        // Sorts share one deal; each search keeps its own row and target.
        deals: {
          sort: { cards: E.parseDeal(E.DEALS.sortLecture, 'hearts'), preset: 'lecture' },
          linear: {
            cards: E.parseDeal(E.DEALS.linearLecture, 'clubs'),
            target: 'c' + E.DEALS.linearTarget,
            preset: 'lecture'
          },
          binary: {
            cards: E.parseDeal(E.DEALS.binaryLecture, 'clubs'),
            target: 'c' + E.DEALS.binaryTarget,
            preset: 'lecture'
          }
        },
        steps: [],
        idx: 0,
        playing: false,
        timer: null,
        waiting: false,
        retry: false, // the last answer was wrong
        readyAt: 0,
        mistakes: 0,
        asks: [], // indexes of the steps that ask the student something
        done: false
      };

      var slots = {}; // card id -> { slot, card }
      var cardsById = {};
      var codeLines = [];

      function algo() { return ALG[state.algo]; }
      function group(key) { return ALG[key].kind === 'sort' ? 'sort' : key; }
      function deal() { return state.deals[group(state.algo)]; }
      function step() { return state.steps[state.idx]; }
      function lastIdx() { return state.steps.length - 1; }
      function motionOK() {
        return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      }
      function animate(el, frames, options) {
        if (motionOK() && el.animate) return el.animate(frames, options);
        return null;
      }

      function now() {
        return window.performance && performance.now ? performance.now() : Date.now();
      }

      function stepMs() {
        return BASE_MS / SPEED_STEPS[state.speed];
      }

      function speedLabel() {
        return '\u00D7' + SPEED_STEPS[state.speed];
      }

      // Small conveniences remembered by this browser. Storage can be blocked, so every use
      // is guarded and the page works without it.
      function readPref(key) {
        try {
          return window.localStorage.getItem('cards.' + key);
        } catch (err) {
          return null;
        }
      }

      function writePref(key, value) {
        try {
          window.localStorage.setItem('cards.' + key, value);
        } catch (err) {
          // not remembered, which is fine
        }
      }

      function stopTimer() {
        clearTimeout(state.timer);
        state.timer = null;
        stopCountdown();
      }

      // Every automatic step goes through here, so the countdown always matches the timer.
      function schedule(fn, ms) {
        clearTimeout(state.timer);
        state.timer = setTimeout(fn, ms);
        startCountdown(ms);
      }

      // A thin bar that fills while the next automatic step is on its way.
      function startCountdown(ms) {
        if (!motionOK()) return;
        var bar = els.countdownFill;
        els.countdown.hidden = false;
        bar.style.transition = 'none';
        bar.style.transform = 'scaleX(0)';
        void bar.offsetWidth; // start from empty
        bar.style.transition = 'transform ' + Math.round(ms) + 'ms linear';
        bar.style.transform = 'scaleX(1)';
      }

      function stopCountdown() {
        els.countdown.hidden = true;
        els.countdownFill.style.transition = 'none';
        els.countdownFill.style.transform = 'scaleX(0)';
      }

      // Deals -------------------------------------------------------------

      function newDeal(g, preset) {
        var old = state.deals[g];
        if (g === 'sort') {
          if (preset === 'lecture') return { cards: E.parseDeal(E.DEALS.sortLecture, 'hearts'), preset: preset };
          if (preset === 'nearly') return { cards: E.parseDeal(E.DEALS.sortNearly, 'hearts'), preset: preset };
          var fresh = SORT_RANKS.map(function (r) { return E.makeCard(r, 'hearts'); });
          var cards;
          do {
            cards = E.shuffle(fresh);
          } while (E.isSorted(cards) || (old && sameOrder(cards, old.cards)));
          return { cards: cards, preset: 'shuffle' };
        }
        var lecture = g === 'linear'
          ? { cards: E.parseDeal(E.DEALS.linearLecture, 'clubs'), target: 'c' + E.DEALS.linearTarget }
          : { cards: E.parseDeal(E.DEALS.binaryLecture, 'clubs'), target: 'c' + E.DEALS.binaryTarget };
        if (preset === 'lecture') {
          lecture.preset = 'lecture';
          return lecture;
        }
        var row = SEARCH_RANKS.map(function (r) { return E.makeCard(r, 'clubs'); });
        if (g === 'linear') {
          do {
            row = E.shuffle(row);
          } while (E.isSorted(row) || (old && sameOrder(row, old.cards)));
        }
        // Binary search needs sorted cards, so only the target changes.
        var target;
        do {
          target = row[Math.floor(Math.random() * row.length)].id;
        } while (old && target === old.target);
        return { cards: row, target: target, preset: 'shuffle' };
      }

      function sameOrder(a, b) {
        return a.map(function (c) { return c.id; }).join() === b.map(function (c) { return c.id; }).join();
      }

      // Building the table ----------------------------------------------

      function faceHTML(card) {
        var r = E.rankLabel(card.rank);
        var s = SUIT[card.suit];
        return '<span class="face front ' + card.suit + '">' +
          '<span class="corner tl"><span class="r">' + r + '</span><span class="s">' + s + '</span></span>' +
          '<span class="pip">' + s + '</span>' +
          '<span class="corner br"><span class="r">' + r + '</span><span class="s">' + s + '</span></span>' +
          '</span>';
      }

      function buildRow() {
        var d = deal();
        els.row.textContent = '';
        slots = {};
        cardsById = {};
        d.cards.forEach(function (card, i) {
          cardsById[card.id] = card;
          var slot = document.createElement('div');
          slot.className = 'slot';
          slot.dataset.id = card.id;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'card';
          btn.dataset.id = card.id;
          btn.innerHTML = '<span class="card-inner" aria-hidden="true">' + faceHTML(card) +
            '<span class="face back"></span></span>';
          var tag = document.createElement('span');
          tag.className = 'tag';
          tag.setAttribute('aria-hidden', 'true');
          tag.innerHTML = '<span class="long">smallest so far</span><span class="short">smallest</span>';
          slot.appendChild(btn);
          slot.appendChild(tag);
          els.row.appendChild(slot);
          slots[card.id] = { slot: slot, card: btn };
          animate(slot, [
            { opacity: 0, transform: 'translateY(-18px) rotate(-4deg)' },
            { opacity: 1, transform: 'none' }
          ], { duration: 320, delay: i * 35, easing: 'ease-out', fill: 'backwards' });
        });

        var search = algo().kind === 'search';
        els.target.hidden = !search;
        if (search) {
          var t = cardsById[d.target];
          els.targetCard.innerHTML = faceHTML(t);
          els.targetCard.setAttribute('aria-label', 'Target: ' + E.cardName(t));
        }
        layout();
      }

      // Card width: min(96px, whatever fits n cards across).
      function layout() {
        var n = deal().cards.length;
        var search = algo().kind === 'search';
        var style = getComputedStyle(els.table);
        var inner = els.table.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
        // The target card sits beside the row when there is room, above it otherwise.
        var side = search && inner >= 720;
        var slotsAcross = side ? n + 1 : n;
        var extra = side ? 28 : 0;
        var gap = 10;
        var w = Math.floor((inner - extra - gap * (slotsAcross - 1)) / slotsAcross);
        if (w < 64) {
          gap = 5;
          w = Math.floor((inner - extra - gap * (slotsAcross - 1)) / slotsAcross);
        }
        if (w < 46) {
          gap = 3;
          w = Math.floor((inner - extra - gap * (slotsAcross - 1)) / slotsAcross);
        }
        w = Math.max(24, Math.min(96, w));
        els.table.style.setProperty('--card-w', w + 'px');
        els.table.style.setProperty('--gap', gap + 'px');
        els.table.classList.toggle('is-tiny', w < 56);
        els.table.classList.toggle('target-top', search && !side);
      }

      // Rendering one snapshot ------------------------------------------

      function has(list, id) { return list.indexOf(id) >= 0; }

      function cardLabel(s, id, pos) {
        var parts = [];
        parts.push(has(s.faceUp, id) ? E.cardName(cardsById[id]) : 'face-down card ' + (pos + 1));
        if (has(s.focus, id)) parts.push('being checked');
        if (has(s.marked, id)) parts.push('smallest so far');
        if (has(s.sorted, id)) parts.push('sorted');
        if (has(s.ruledOut, id)) parts.push('ruled out');
        return parts.join(', ');
      }

      function render(opts) {
        opts = opts || {};
        var s = step();
        var flip = opts.animate && motionOK();
        var duration = Math.min(560, stepMs() * 0.5);

        // FLIP, step 1: measure where every card is now (mid-animation included).
        var first = {};
        if (flip) {
          s.order.forEach(function (id) {
            first[id] = slots[id].slot.getBoundingClientRect().left;
          });
        }
        s.order.forEach(function (id) {
          var a = slots[id].slot.getAnimations ? slots[id].slot.getAnimations() : [];
          a.forEach(function (x) { x.cancel(); });
        });

        // Reorder the DOM, keeping keyboard focus on the same card.
        var now = Array.prototype.map.call(els.row.children, function (el) { return el.dataset.id; });
        if (now.join() !== s.order.join()) {
          var active = document.activeElement;
          s.order.forEach(function (id) { els.row.appendChild(slots[id].slot); });
          if (active && els.row.contains(active)) active.focus({ preventScroll: true });
        }

        var pickable = state.mode === 'try' && (algo().kind === 'search' || state.algo === 'selection');
        s.order.forEach(function (id, pos) {
          var c = slots[id].card;
          c.classList.toggle('is-down', !has(s.faceUp, id));
          c.classList.toggle('is-focus', has(s.focus, id));
          c.classList.toggle('is-sorted', has(s.sorted, id));
          c.classList.toggle('is-out', has(s.ruledOut, id));
          c.classList.toggle('is-pickable', pickable && state.waiting);
          slots[id].slot.classList.toggle('is-marked', has(s.marked, id));
          c.setAttribute('aria-label', cardLabel(s, id, pos));
          c.tabIndex = pickable ? 0 : -1;
          if (pickable && !state.waiting) c.setAttribute('aria-disabled', 'true');
          else c.removeAttribute('aria-disabled');
        });

        // FLIP, steps 2-3: measure the new spots, then slide from old to new.
        // The card moving left arcs up and the one moving right dips, so they pass.
        if (flip) {
          s.order.forEach(function (id) {
            var slot = slots[id].slot;
            var dx = first[id] - slot.getBoundingClientRect().left;
            if (Math.abs(dx) < 1) return;
            var arc = dx > 0 ? -16 : 10;
            slot.style.zIndex = dx > 0 ? 3 : 2;
            var anim = slot.animate([
              { transform: 'translate(' + dx + 'px, 0)' },
              { transform: 'translate(' + dx / 2 + 'px, ' + arc + 'px)', offset: 0.5 },
              { transform: 'translate(0, 0)' }
            ], { duration: duration, easing: 'cubic-bezier(0.35, 0.6, 0.3, 1)' });
            anim.onfinish = anim.oncancel = function () { slot.style.zIndex = ''; };
          });
        }

        codeLines.forEach(function (el, i) {
          var on = i === s.line;
          el.classList.toggle('is-active', on);
          if (on) el.setAttribute('aria-current', 'step');
          else el.removeAttribute('aria-current');
        });

        renderCounts(!opts.animate);
        renderStatus();
      }

      // The status line: what is happening, where the run is, and the timeline.
      function renderStatus() {
        var s = step();
        var watch = state.mode === 'watch';
        var last = lastIdx();
        var kind;
        var text;
        if (watch) {
          if (state.idx >= last) { kind = 'done'; text = 'Finished'; }
          else if (state.playing) { kind = 'playing'; text = 'Playing ' + speedLabel(); }
          else if (state.idx === 0) { kind = 'ready'; text = 'Ready'; }
          else { kind = 'paused'; text = 'Paused'; }
        } else if (state.done) { kind = 'done'; text = 'Finished'; }
        else if (state.retry) { kind = 'retry'; text = 'Try again'; }
        else if (state.waiting) { kind = 'turn'; text = 'Your turn'; }
        else { kind = 'moving'; text = 'Algorithm moving'; }
        els.statePill.dataset.state = kind;
        els.stateText.textContent = text;
        els.phase.textContent = s.phase || '';
        els.scrub.hidden = !watch;
        els.progress.hidden = watch;
        if (watch) {
          var where = 'Step ' + state.idx + ' of ' + last;
          els.progressText.textContent = where;
          els.scrub.max = String(last);
          els.scrub.value = String(state.idx);
          els.scrub.setAttribute('aria-valuetext', where);
          els.scrub.style.setProperty('--pct', (last ? (state.idx / last) * 100 : 0) + '%');
        } else {
          var total = state.asks.length;
          var made = state.asks.filter(function (i) { return i < state.idx; }).length;
          els.progressText.textContent = state.done ? 'All ' + total + ' decisions made'
            : state.waiting ? 'Decision ' + (made + 1) + ' of ' + total
              : made + ' of ' + total + ' decisions made';
          els.progress.setAttribute('aria-valuemax', String(total));
          els.progress.setAttribute('aria-valuenow', String(made));
          els.progressFill.style.width = (total ? (made / total) * 100 : 0) + '%';
        }
      }

      function setNum(el, html, quiet) {
        if (el.innerHTML === html) return;
        el.innerHTML = html;
        el.classList.remove('bump');
        if (!quiet && motionOK()) {
          void el.offsetWidth; // restart the animation
          el.classList.add('bump');
        }
      }

      function renderCounts(quiet) {
        var c = step().counts;
        if (algo().kind === 'sort') {
          setNum(els.numA, String(c.comparisons), quiet);
          setNum(els.numB, String(c.swaps), quiet);
        } else {
          setNum(els.numA, String(c.flips), quiet);
        }
        if (state.mode === 'try') setNum(els.numC, String(state.mistakes), quiet);
      }

      function narrate(text, prompt, feedback) {
        els.narration.textContent = text || '';
        if (prompt) {
          var p = document.createElement('span');
          p.className = 'prompt';
          p.textContent = prompt;
          els.narration.appendChild(p);
        }
        els.narration.classList.toggle('is-feedback', !!feedback);
        els.status.classList.toggle('is-feedback', !!feedback);
      }

      function wave() {
        step().order.forEach(function (id, i) {
          animate(slots[id].slot, [
            { transform: 'translateY(0)' },
            { transform: 'translateY(-14px)', offset: 0.45 },
            { transform: 'translateY(0)' }
          ], { duration: 460, delay: 120 + i * 65, easing: 'ease-in-out' });
        });
      }

      function shake(el) {
        animate(el, [
          { transform: 'translateX(0)' },
          { transform: 'translateX(-7px)' },
          { transform: 'translateX(6px)' },
          { transform: 'translateX(-4px)' },
          { transform: 'translateX(2px)' },
          { transform: 'translateX(0)' }
        ], { duration: 380, easing: 'ease-out' });
      }

      // Static parts: tabs, idea, pseudocode, counters, deal buttons ----

      function renderTabs() {
        if (!els.tabs.children.length) {
          E.ORDER.forEach(function (key, i) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'tab';
            b.dataset.algo = key;
            b.innerHTML = '<span class="tab-num" aria-hidden="true">' + (i + 1) + '</span>';
            b.appendChild(document.createTextNode(ALG[key].name));
            b.dataset.tip = ALG[key].idea;
            b.dataset.keys = String(i + 1);
            b.addEventListener('click', function () { setAlgo(key); });
            els.tabs.appendChild(b);
          });
        }
        Array.prototype.forEach.call(els.tabs.children, function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.algo === state.algo));
        });
      }

      function renderStatic() {
        var a = algo();
        renderTabs();
        els.modeWatch.setAttribute('aria-pressed', String(state.mode === 'watch'));
        els.modeTry.setAttribute('aria-pressed', String(state.mode === 'try'));

        els.idea.textContent = '';
        var ideaLine = [['Idea: ', a.idea]];
        if (state.mode === 'try') ideaLine.push([' Your turn: ', a.goal]);
        ideaLine.forEach(function (part) {
          var label = document.createElement('span');
          label.className = 'idea-label';
          label.textContent = part[0];
          els.idea.appendChild(label);
          els.idea.appendChild(document.createTextNode(part[1]));
        });

        els.code.textContent = '';
        codeLines = a.code.map(function (line) {
          var div = document.createElement('div');
          div.className = 'code-line indent-' + line.indent;
          var arrow = document.createElement('span');
          arrow.className = 'arrow';
          arrow.setAttribute('aria-hidden', 'true');
          arrow.textContent = '▶';
          var text = document.createElement('span');
          line.text.split('**').forEach(function (part, i) {
            if (!part) return;
            if (i % 2) {
              var kw = document.createElement('span');
              kw.className = 'kw';
              kw.textContent = part;
              text.appendChild(kw);
            } else {
              text.appendChild(document.createTextNode(part));
            }
          });
          div.appendChild(arrow);
          div.appendChild(text);
          els.code.appendChild(div);
          return div;
        });

        // The pills and counter names define themselves: hover, focus, or tap them.
        els.pills.textContent = '';
        a.pills.forEach(function (name) {
          var pill = document.createElement('button');
          pill.type = 'button';
          pill.className = 'pill ' + name.toLowerCase();
          pill.textContent = name;
          pill.dataset.tip = PILL_TIPS[name];
          pill.dataset.toggle = '';
          els.pills.appendChild(pill);
        });

        var sort = a.kind === 'sort';
        term(els.labelA, sort ? 'Comparisons' : 'Flips');
        els.statB.hidden = !sort;
        term(els.labelB, 'Swaps');
        term(els.labelC, 'Mistakes');
        els.statC.hidden = state.mode === 'watch';
        els.numA.innerHTML = els.numB.innerHTML = els.numC.innerHTML = '';

        renderDeals();

        var watch = state.mode === 'watch';
        els.keys.hidden = !watch;
        els.watchControls.hidden = !watch;
        els.tryControls.hidden = watch;
        els.finish.hidden = true;
        els.decide.hidden = !(state.algo === 'insertion' || state.algo === 'bubble');
      }

      var PILL_TIPS = {
        Iteration: 'Iteration: repeating steps, as in For each and Repeat until.',
        Selection: 'Selection: choosing what to do with If. (A building block, not selection sort.)',
        Sequencing: 'Sequencing: steps that run one after another, in order.'
      };
      var TERM_TIPS = {
        Comparisons: 'Each time two cards are compared. The slides use this to measure the work.',
        Flips: 'Each card turned over. Fewer flips means a faster search.',
        Swaps: 'Each time two cards change places.',
        Mistakes: 'Wrong moves, plus each time you used Show me.'
      };
      var DEAL_TIPS = {
        lecture: 'The deal from the W5A slides',
        nearly: 'Almost in order: one pair is out of place',
        sortShuffle: 'A random order',
        linearShuffle: 'A random order and a random card to find',
        binaryShuffle: 'The same sorted cards, a random card to find'
      };

      function term(holder, word) {
        holder.textContent = '';
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'term';
        b.textContent = word;
        b.dataset.tip = TERM_TIPS[word];
        b.dataset.toggle = '';
        holder.appendChild(b);
      }

      function renderDeals() {
        var g = group(state.algo);
        var options = g === 'sort'
          ? [['lecture', 'Lecture deal'], ['nearly', 'Nearly sorted'], ['shuffle', 'New shuffle']]
          : [['lecture', 'Lecture deal'], ['shuffle', g === 'binary' ? 'New target' : 'New shuffle']];
        // The buttons are rebuilt, so keep focus on the one pressed from the keyboard. After a
        // mouse click focus is let go, so Space still plays instead of dealing again.
        var active = document.activeElement;
        var focused = els.deals.contains(active) && focusVisible(active) ? active.dataset.preset : null;
        els.deals.textContent = '';
        var label = document.createElement('span');
        label.className = 'deals-label';
        label.textContent = 'Deal:';
        els.deals.appendChild(label);
        options.forEach(function (o) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'btn';
          b.textContent = o[1];
          b.dataset.preset = o[0];
          b.dataset.tip = o[0] === 'shuffle' ? DEAL_TIPS[g + 'Shuffle'] : DEAL_TIPS[o[0]];
          if (o[0] !== 'shuffle') b.setAttribute('aria-pressed', String(deal().preset === o[0]));
          b.addEventListener('click', function () { setDeal(o[0]); });
          els.deals.appendChild(b);
          if (o[0] === focused) b.focus({ preventScroll: true });
        });
      }

      // Loading an algorithm + deal -------------------------------------

      function load() {
        stopTimer();
        setPlaying(false);
        var d = deal();
        state.steps = E.run(state.algo, d.cards, { target: d.target });
        state.asks = state.steps.map(function (s, i) { return s.ask ? i : -1; }).filter(function (i) { return i >= 0; });
        state.idx = 0;
        state.mistakes = 0;
        state.waiting = false;
        state.retry = false;
        state.done = false;
        hideTip();
        renderStatic();
        buildRow();
        if (state.mode === 'watch') {
          render();
          narrateWatch();
          updateWatchButtons();
        } else {
          enterTry(null);
        }
      }

      function setAlgo(key) {
        if (key === state.algo) return;
        state.algo = key;
        if (state.mode === 'try') state.deals[group(key)] = newDeal(group(key), 'shuffle');
        load();
      }

      function setMode(mode) {
        if (mode === state.mode) return;
        state.mode = mode;
        if (mode === 'try') state.deals[group(state.algo)] = newDeal(group(state.algo), 'shuffle');
        load();
      }

      function setDeal(preset) {
        var g = group(state.algo);
        state.deals[g] = newDeal(g, preset);
        load();
      }

      function setSpeed(index) {
        if (!(index >= 0)) index = NORMAL_SPEED; // NaN from a bad saved value
        state.speed = Math.max(0, Math.min(SPEED_STEPS.length - 1, Math.round(index)));
        document.documentElement.style.setProperty('--anim', Math.round(stepMs() * 0.38) + 'ms');
        Array.prototype.forEach.call(document.querySelectorAll('.speed-input'), function (input) {
          input.value = String(state.speed);
          input.setAttribute('aria-valuetext', SPEED_NAMES[state.speed]);
        });
        Array.prototype.forEach.call(document.querySelectorAll('.speed-out'), function (out) {
          out.textContent = speedLabel();
        });
        writePref('speed', String(state.speed));
        if (!state.steps.length) return;
        if (state.mode === 'watch' && state.playing) tick(); // the next step at the new pace
        renderStatus();
      }

      // Watch mode ------------------------------------------------------

      function narrateWatch() {
        var s = step();
        narrate(s.say + (state.idx === 0 ? ' Press Play or Next to start.' : ''));
      }

      function updateWatchButtons() {
        els.back.setAttribute('aria-disabled', String(state.idx === 0));
        els.reset.setAttribute('aria-disabled', String(state.idx === 0));
        els.next.setAttribute('aria-disabled', String(state.idx === lastIdx()));
      }

      function go(idx) {
        var forward = idx > state.idx;
        state.idx = Math.max(0, Math.min(lastIdx(), idx));
        render({ animate: true });
        narrateWatch();
        updateWatchButtons();
        if (forward && state.idx === lastIdx()) wave();
      }

      function setPlaying(on) {
        state.playing = on;
        els.play.querySelector('.icon').innerHTML = on ? '&#10074;&#10074;' : '&#9654;';
        els.play.lastElementChild.textContent = on ? 'Pause' : 'Play';
        if (!on && state.mode === 'watch') stopTimer();
        if (state.steps.length) renderStatus();
      }

      function tick() {
        schedule(function () {
          go(state.idx + 1);
          if (state.idx >= lastIdx()) setPlaying(false);
          else tick();
        }, stepMs());
      }

      function togglePlay() {
        if (state.playing) {
          setPlaying(false);
          return;
        }
        if (state.idx >= lastIdx()) go(0);
        else go(state.idx + 1);
        if (state.idx < lastIdx()) {
          setPlaying(true);
          tick();
        }
      }

      function next() {
        setPlaying(false);
        if (state.idx < lastIdx()) go(state.idx + 1);
      }

      function back() {
        setPlaying(false);
        if (state.idx > 0) go(state.idx - 1);
      }

      // Try-it mode -----------------------------------------------------

      // Show the current step. `lead` is the response to the student's last move.
      // Steps without an ask play on their own; a step with an ask waits for the student.
      function enterTry(lead) {
        stopTimer();
        var s = step();
        // A swap step's `say` gives the answer away, so only the question shows.
        var text = lead || (s.ask && s.ask.kind === 'swap' ? '' : s.say);
        state.waiting = !!s.ask && state.idx < lastIdx();
        state.retry = false;
        state.readyAt = now() + SETTLE_MS;
        render({ animate: state.idx > 0 });
        updateTryButtons();
        if (state.idx >= lastIdx()) {
          narrate(text);
          finish();
          return;
        }
        if (s.ask) {
          narrate(text, s.ask.question);
          return;
        }
        narrate(text);
        var delay = stepMs();
        if (lead) delay *= 1.3;
        else if (state.algo === 'selection' && (s.line === 1 || s.line === 2)) delay *= 0.45;
        schedule(function () {
          state.idx++;
          enterTry(null);
        }, delay);
      }

      function updateTryButtons() {
        var off = String(!state.waiting);
        els.swap.setAttribute('aria-disabled', off);
        els.noswap.setAttribute('aria-disabled', off);
        els.show.setAttribute('aria-disabled', off);
      }

      function advance(lead) {
        var asked = step().ask;
        state.waiting = false;
        state.idx++;
        enterTry(lead + (asked.explain || step().say));
      }

      function answer(choice, el) {
        if (state.mode !== 'try' || !state.waiting || now() < state.readyAt) return;
        var s = step();
        if (choice === s.ask.answer) {
          advance('Right. ');
          return;
        }
        state.mistakes++;
        state.retry = true;
        state.readyAt = now() + SETTLE_MS;
        renderCounts();
        renderStatus();
        shake(el);
        narrate(E.explainWrong(state.algo, s, choice, cardsById), null, true);
      }

      function showMe() {
        if (state.mode !== 'try' || !state.waiting || now() < state.readyAt) return;
        state.mistakes++;
        advance('Here is the right move. ');
      }

      function finish() {
        state.done = true;
        state.waiting = false;
        var d = deal();
        var c = step().counts;
        var mistakes = E.plural(state.mistakes, 'mistake');
        var main;
        var compare;
        if (algo().kind === 'sort') {
          var all = E.compareSorts(d.cards);
          main = 'Sorted in ' + E.plural(c.comparisons, 'comparison') + ', ' + mistakes + '.';
          compare = 'On this deal: selection ' + all.selection + ' · insertion ' + all.insertion +
            ' · bubble ' + all.bubble;
        } else {
          var both = E.compareSearches(d.cards, d.target);
          main = 'Found in ' + E.plural(c.flips, 'flip') + ', ' + mistakes + '.';
          compare = state.algo === 'binary'
            ? 'Linear search needed ' + both.linear + ' on this row.'
            : 'Binary search only works on sorted cards. With these cards sorted, it would need ' +
              E.plural(both.binary, 'flip') + '.';
        }
        els.finishMain.textContent = main;
        els.finishCompare.textContent = compare;
        var focusLost = els.tryControls.contains(document.activeElement) ||
          els.row.contains(document.activeElement);
        els.tryControls.hidden = true;
        els.finish.hidden = false;
        if (focusLost) els.again.focus({ preventScroll: true });
        renderStatus();
        wave();
      }

      // Events ----------------------------------------------------------

      els.modeWatch.addEventListener('click', function () { setMode('watch'); });
      els.modeTry.addEventListener('click', function () { setMode('try'); });
      els.reset.addEventListener('click', function () { setPlaying(false); go(0); });
      els.back.addEventListener('click', back);
      els.next.addEventListener('click', next);
      els.play.addEventListener('click', togglePlay);
      Array.prototype.forEach.call(document.querySelectorAll('.speed-input'), function (input) {
        input.addEventListener('input', function () { setSpeed(Number(input.value)); });
      });
      els.scrub.addEventListener('input', function () {
        var to = Number(els.scrub.value); // read first: pausing redraws the timeline
        setPlaying(false);
        go(to);
      });
      // After a drag with the mouse or a finger, a slider lets go of focus, so the arrow keys
      // and a clicker go back to stepping through the algorithm.
      Array.prototype.forEach.call(document.querySelectorAll('input[type="range"]'), function (input) {
        input.addEventListener('pointerup', function () {
          setTimeout(function () { input.blur(); }, 0);
        });
      });

      // e.detail > 1 is the second click of a double click; keyboard presses have detail 0.
      els.swap.addEventListener('click', function (e) { if (e.detail < 2) answer(true, els.swap); });
      els.noswap.addEventListener('click', function (e) { if (e.detail < 2) answer(false, els.noswap); });
      els.show.addEventListener('click', function (e) { if (e.detail < 2) showMe(); });
      // The finish panel hides on these, so move focus to where the next action is.
      els.again.addEventListener('click', function () {
        setDeal('shuffle');
        (els.decide.hidden ? els.row.querySelector('.card') : els.swap).focus({ preventScroll: true });
      });
      els.watchIt.addEventListener('click', function () {
        setMode('watch');
        els.play.focus({ preventScroll: true });
      });

      els.row.addEventListener('click', function (e) {
        var card = e.target.closest('.card');
        if (!card || state.mode !== 'try' || e.detail > 1) return;
        if (algo().kind !== 'search' && state.algo !== 'selection') return;
        answer(card.dataset.id, slots[card.dataset.id].slot);
      });

      function focusVisible(el) {
        try {
          return el.matches(':focus-visible');
        } catch (err) {
          return true; // an older browser: let Space press the button as usual
        }
      }

      // Presentation clickers send Page Up / Page Down.
      var spaceHandled = false;
      document.addEventListener('keydown', function (e) {
        if (tour.open) {
          tourKey(e);
          return;
        }
        if (e.key === 'Escape' && !els.tip.hidden) {
          hideTip();
          return;
        }
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        var t = e.target;
        // A presentation clicker sends Page Up / Page Down: those always step, even when a
        // slider has focus. Other keys on a slider adjust the slider.
        var clicker = e.key === 'PageDown' || e.key === 'PageUp';
        var onRange = t.matches && t.matches('input[type="range"]');
        if (!(clicker && onRange) && t.closest && t.closest('input, select, textarea, [contenteditable]')) return;
        if (e.key === '?') {
          e.preventDefault();
          startTour();
          return;
        }
        if (e.key === '+' || e.key === '=') {
          e.preventDefault();
          setSpeed(state.speed + 1);
          return;
        }
        if (e.key === '-' || e.key === '_') {
          e.preventDefault();
          setSpeed(state.speed - 1);
          return;
        }
        if (/^[1-5]$/.test(e.key)) {
          setAlgo(E.ORDER[Number(e.key) - 1]);
          return;
        }
        if (state.mode !== 'watch') return;
        if (e.key === 'Home' || e.key === 'End') {
          e.preventDefault();
          setPlaying(false);
          go(e.key === 'Home' ? 0 : lastIdx());
        } else if (e.key === 'ArrowRight' || e.key === 'PageDown') {
          e.preventDefault();
          next();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          back();
        } else if (e.key === ' ' || e.key === 'Spacebar') {
          // Space still presses a button reached with the keyboard.
          if (t.closest && t.closest('button') && focusVisible(t)) return;
          e.preventDefault();
          spaceHandled = true;
          togglePlay();
        }
      });
      document.addEventListener('keyup', function (e) {
        if ((e.key === ' ' || e.key === 'Spacebar') && spaceHandled) {
          e.preventDefault();
          spaceHandled = false;
        }
      });

      // Re-fit the cards when the table width changes. The work waits for the next frame:
      // changing the table's height inside the observer callback is a resize loop.
      // A window resize also asks, in case the observer is slow to report (seen in WebKit).
      var lastWidth = -1;
      var frame = 0;
      function refit(width) {
        if (width === lastWidth) return;
        lastWidth = width;
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(layout);
      }
      if (window.ResizeObserver) {
        new ResizeObserver(function (entries) { refit(entries[0].contentRect.width); }).observe(els.table);
      }
      window.addEventListener('resize', function () { refit(els.table.getBoundingClientRect().width); });

      // Tooltips ----------------------------------------------------------
      // Anything with data-tip gets a tooltip on hover (after a short pause) or keyboard focus.
      // With data-toggle it also opens on a click or tap, for phones and definitions.

      var TIPS = [
        [els.modeWatch, 'Watch the algorithm, one step at a time'],
        [els.modeTry, 'Make each decision yourself'],
        [els.reset, 'Back to the first step', 'Home'],
        [els.back, 'One step back', '\u2190'],
        [els.play, 'Play the steps on their own', 'Space'],
        [els.next, 'One step forward', '\u2192'],
        [els.swap, 'Swap the two highlighted cards'],
        [els.noswap, 'Leave the two highlighted cards where they are'],
        [els.show, 'Make the right move for you. It counts as a mistake.'],
        [els.again, 'A new shuffle, same algorithm'],
        [els.watchIt, 'Watch the algorithm on this same deal']
      ];
      TIPS.forEach(function (t) {
        t[0].dataset.tip = t[1];
        if (t[2]) t[0].dataset.keys = t[2];
      });

      var tipOwner = null; // the element whose data-tip is showing
      var tipFor = null; // the element described by it, for screen readers
      var tipSticky = false; // opened by a click or tap
      var tipTimer = 0;

      function showTip(owner, described, sticky) {
        if (tour.open) return;
        hideTip();
        els.tip.textContent = owner.dataset.tip;
        if (owner.dataset.keys) {
          var keys = document.createElement('span');
          keys.className = 'tip-keys';
          keys.appendChild(document.createTextNode(' Key: '));
          owner.dataset.keys.split(' ').forEach(function (k, i) {
            if (i) keys.appendChild(document.createTextNode(' '));
            var kbd = document.createElement('kbd');
            kbd.textContent = k;
            keys.appendChild(kbd);
          });
          els.tip.appendChild(keys);
        }
        els.tip.hidden = false;
        tipOwner = owner;
        tipFor = described || owner;
        tipSticky = !!sticky;
        tipFor.setAttribute('aria-describedby', 'tip');
        placeTip();
      }

      function hideTip() {
        clearTimeout(tipTimer);
        if (tipFor) tipFor.removeAttribute('aria-describedby');
        tipOwner = tipFor = null;
        tipSticky = false;
        els.tip.hidden = true;
      }

      // Above the element if there is room, otherwise below; always inside the window.
      function placeTip() {
        if (!tipOwner) return;
        var r = tipOwner.getBoundingClientRect();
        var w = els.tip.offsetWidth;
        var h = els.tip.offsetHeight;
        var vw = document.documentElement.clientWidth;
        var top = r.top - h - 8;
        if (top < 8) top = r.bottom + 8;
        var left = Math.max(16, Math.min(vw - 16 - w, r.left + r.width / 2 - w / 2));
        els.tip.style.top = Math.round(top + window.scrollY) + 'px';
        els.tip.style.left = Math.round(left + window.scrollX) + 'px';
      }

      function tipOwnerOf(node) {
        return node && node.closest ? node.closest('[data-tip]') : null;
      }

      document.addEventListener('pointerover', function (e) {
        if (e.pointerType !== 'mouse') return;
        var owner = tipOwnerOf(e.target);
        if (!owner || owner === tipOwner) return;
        clearTimeout(tipTimer);
        tipTimer = setTimeout(function () { showTip(owner); }, 450);
      });
      document.addEventListener('pointerout', function (e) {
        var owner = tipOwnerOf(e.target);
        if (!owner || owner.contains(e.relatedTarget)) return;
        clearTimeout(tipTimer);
        if (owner === tipOwner && !tipSticky) hideTip();
      });
      document.addEventListener('pointerdown', function (e) {
        var t = e.target.closest && e.target.closest('[data-toggle]');
        if (!t || t !== tipOwner) hideTip();
      });
      document.addEventListener('click', function (e) {
        var t = e.target.closest && e.target.closest('[data-toggle]');
        if (!t) return;
        if (t === tipOwner && tipSticky) hideTip();
        else showTip(t, t, true);
      });
      document.addEventListener('focusin', function (e) {
        var owner = tipOwnerOf(e.target);
        if (owner && focusVisible(e.target)) showTip(owner, e.target);
      });
      document.addEventListener('focusout', function (e) {
        if (e.target === tipFor && !tipSticky) hideTip();
      });
      window.addEventListener('resize', hideTip);

      // Tour ---------------------------------------------------------------
      // A guided tour: a spotlight on each part of the page, with a short note beside it.

      var tour = { open: false, i: 0, steps: [], opener: null, resume: false };

      function visibleSpeed() {
        return document.querySelector((state.mode === 'watch' ? '#watch-controls' : '#try-controls') + ' .speed');
      }

      var TOUR = [
        { el: function () { return els.tabs; }, title: 'Pick an algorithm',
