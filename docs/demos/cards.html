          text: 'Five algorithms from the W5A lecture: two ways to search and three ways to sort. The number keys 1 to 5 switch between them.' },
        { el: function () { return els.modeWatch.parentElement; }, title: 'Watch, then try',
          text: 'Watch shows every step. Try it hands each decision to you, and says why when a move breaks the rule.' },
        { el: function () { return els.table; }, title: 'The cards',
          text: 'Cards being compared lift and get a gold outline. Locked-in cards get a gold edge. In binary search, ruled-out cards fade.' },
        { el: function () { return els.statePill.parentElement; }, title: 'What is happening now',
          text: function () {
            return state.mode === 'watch'
              ? 'Ready, playing, paused or finished, and where the algorithm is: which pass, or which card.'
              : 'Your turn, or the algorithm moving on its own, and how many decisions are left.';
          } },
        { el: function () { return els.narration; }, title: 'Each step, explained',
          text: 'This line says what just happened and why. Screen readers read it out as it changes.' },
        { el: function () { return els.scrub.parentElement; }, title: 'Where you are',
          text: function () {
            return state.mode === 'watch'
              ? 'The timeline fills as the steps go by. Drag it to jump to any step. The thin gold line fills before each automatic step.'
              : 'This bar fills with each decision you make. The thin gold line fills before the algorithm moves on its own.';
          } },
        { el: function () { return state.mode === 'watch' ? els.watchControls.querySelector('.controls') : els.tryControls; },
          title: function () { return state.mode === 'watch' ? 'Step through it' : 'Make your move'; },
          text: function () {
            if (state.mode === 'watch') {
              return 'Back and Next move one step; Play runs on its own. The arrow keys, Space, Home and End work too, and so does a presentation clicker.';
            }
            return els.decide.hidden
              ? 'Click the card the algorithm would choose next. Show me makes the move for you, and counts it as a mistake.'
              : 'At each comparison, choose Swap or Don\'t swap. Show me makes the move for you, and counts it as a mistake.';
          } },
        { el: visibleSpeed, title: 'Set the pace',
          text: 'Slide from a quarter speed to three times as fast. The minus and plus keys work too, and this browser remembers your choice.' },
        { el: function () { return els.code.parentElement; }, title: 'The algorithm',
          text: 'The pseudocode from the slides. The highlighted line is the one running now. The coloured pills name its building blocks: tap one to see what it means.' },
        { el: function () { return els.numA.parentElement.parentElement; }, title: 'Keep count',
          text: 'Comparisons and swaps, or flips for a search. Compare these numbers between algorithms on the same deal. Tap a name to see what it counts.' },
        { el: function () { return els.deals; }, title: 'Try another deal',
          text: 'The deal from the slides, a nearly sorted one, or a new shuffle.' },
        { el: function () { return els.tourBtn; }, title: 'That is the tour',
          text: 'Hover over or focus any control for a hint. Press Tour, or the question mark key, to see this again.' }
      ];

      function textOf(v) {
        return typeof v === 'function' ? v() : v;
      }

      function startTour() {
        if (tour.open) return;
        hideTip();
        tour.opener = document.activeElement;
        // Nothing moves on its own while the tour is open.
        if (state.mode === 'watch') {
          setPlaying(false);
        } else if (state.timer) {
          stopTimer();
          tour.resume = true;
        }
        tour.steps = TOUR.filter(function (t) {
          var el = t.el();
          return el && el.getClientRects().length > 0;
        });
        tour.open = true;
        els.intro.hidden = true;
        document.documentElement.classList.add('touring');
        els.tour.hidden = false;
        showTourStep(0);
      }

      function showTourStep(i) {
        tour.i = Math.max(0, Math.min(tour.steps.length - 1, i));
        var t = tour.steps[tour.i];
        t.el().scrollIntoView({ block: 'center', inline: 'nearest' });
        els.tourCount.textContent = (tour.i + 1) + ' of ' + tour.steps.length;
        els.tourTitle.textContent = textOf(t.title);
        els.tourText.textContent = textOf(t.text);
        els.tourBack.hidden = tour.i === 0;
        els.tourNext.textContent = tour.i === tour.steps.length - 1 ? 'Done' : 'Next';
        placeTour();
        els.tourTitle.focus({ preventScroll: true });
      }

      // The spotlight hugs the element; the note sits below it, above it, or at the bottom.
      function placeTour() {
        if (!tour.open) return;
        var r = tour.steps[tour.i].el().getBoundingClientRect();
        var pad = 6;
        var vw = document.documentElement.clientWidth;
        var vh = window.innerHeight;
        var spot = { top: r.top - pad, left: r.left - pad, width: r.width + pad * 2, height: r.height + pad * 2 };
        els.tourSpot.style.top = spot.top + 'px';
        els.tourSpot.style.left = spot.left + 'px';
        els.tourSpot.style.width = spot.width + 'px';
        els.tourSpot.style.height = spot.height + 'px';
        var cw = els.tourCard.offsetWidth;
        var ch = els.tourCard.offsetHeight;
        var top;
        if (spot.top + spot.height + 12 + ch <= vh - 8) top = spot.top + spot.height + 12;
        else if (spot.top - 12 - ch >= 8) top = spot.top - 12 - ch;
        else top = Math.max(8, vh - ch - 8);
        var left = Math.max(16, Math.min(vw - 16 - cw, r.left + r.width / 2 - cw / 2));
        els.tourCard.style.top = Math.round(top) + 'px';
        els.tourCard.style.left = Math.round(left) + 'px';
      }

      function endTour() {
        if (!tour.open) return;
        tour.open = false;
        els.tour.hidden = true;
        document.documentElement.classList.remove('touring');
        writePref('tourSeen', '1');
        var back = tour.opener && tour.opener !== document.body && document.contains(tour.opener) &&
          tour.opener.getClientRects().length ? tour.opener : els.tourBtn;
        back.focus({ preventScroll: true });
        if (tour.resume) {
          tour.resume = false;
          if (state.mode === 'try' && !state.waiting && !state.done) enterTry(null);
        }
      }

      // While the tour is open, keys belong to it: Escape ends it, the arrows move through it,
      // and Tab stays inside the note.
      function tourKey(e) {
        if (e.key === 'Escape') {
          e.preventDefault();
          endTour();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          if (tour.i < tour.steps.length - 1) showTourStep(tour.i + 1);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          if (tour.i > 0) showTourStep(tour.i - 1);
        } else if (e.key === 'Tab') {
          var items = [els.tourBack, els.tourNext, els.tourClose].filter(function (b) { return !b.hidden; });
          var at = items.indexOf(document.activeElement);
          e.preventDefault();
          var next = e.shiftKey ? (at <= 0 ? items.length - 1 : at - 1) : (at === -1 || at === items.length - 1 ? 0 : at + 1);
          items[next].focus();
        }
      }

      els.tourBtn.addEventListener('click', startTour);
      els.introTour.addEventListener('click', startTour);
      els.introDismiss.addEventListener('click', function () {
        writePref('tourSeen', '1');
        els.intro.hidden = true;
        els.tourBtn.focus({ preventScroll: true });
      });
      els.tourNext.addEventListener('click', function () {
        if (tour.i === tour.steps.length - 1) endTour();
        else showTourStep(tour.i + 1);
      });
      els.tourBack.addEventListener('click', function () { showTourStep(tour.i - 1); });
      els.tourClose.addEventListener('click', endTour);
      window.addEventListener('resize', placeTour);

      if (!readPref('tourSeen')) els.intro.hidden = false;
      var savedSpeed = readPref('speed');
      setSpeed(savedSpeed === null ? NORMAL_SPEED : Number(savedSpeed));
      load();
    })();
  </script>
</body>

</html>
