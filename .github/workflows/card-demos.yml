# Tests for the Card Demos page (docs/demos/). They run only when the page, its tests or this
# workflow change, or when a sidebar edit touches the Card Demos link or the lines around it.
# Edits to other course pages, the rest of the sidebar, or the site shell skip them.
name: Card demo tests

on:
  pull_request:
    paths:
      - 'docs/demos/**'
      - 'docs/_sidebar.md'
      - 'tests/**'
      - '.github/workflows/card-demos.yml'
  push:
    branches: [main]
    paths:
      - 'docs/demos/**'
      - 'docs/_sidebar.md'
      - 'tests/**'
      - '.github/workflows/card-demos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-demo-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The paths above cannot tell a sidebar edit near the Card Demos link from one elsewhere in
  # the sidebar, so look at the diff. A sidebar change counts when its patch (the changed lines
  # plus three lines of context) includes the link, which covers the order the tests check.
  changes:
    name: Check for card changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cards: ${{ steps.check.outputs.cards }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo cards=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" > compare.json
          # A sidebar file with no patch (too large to show) counts as a card change.
          cards=$(jq 'any(.files[];
            (.filename | startswith("docs/demos/") or startswith("tests/"))
            or .filename == ".github/workflows/card-demos.yml"
            or (.filename == "docs/_sidebar.md"
                and ((.patch // "demos/cards.html") | contains("demos/cards.html"))))' compare.json)
          [ "$cards" = true ] || echo "Only sidebar lines away from the Card Demos link changed; skipping the tests."
          echo "cards=$cards" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.browser }}
    needs: changes
    if: needs.changes.outputs.cards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One runner per browser: faster, and one browser cannot slow down another.
        browser: [chromium, firefox, webkit]
    # Playwright's own image, the same version as tests/package.json, with Chromium,
    # Firefox and WebKit installed. Screenshots are compared against the -linux baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        if: matrix.browser == 'chromium'
        run: npm run test:unit

      - name: Browser tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: 'true'

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            tests/test-results/
            tests/browser/visual.spec.js-snapshots/
          retention-days: 14
